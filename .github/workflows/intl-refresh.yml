name: intl-refresh

# ΑΥΤΟΜΑΤΗ ΑΝΑΝΕΩΣΗ ΕΘΝΙΚΩΝ (25/9/2026, εντολη Στελιου): ελεγχει στο FotMob ποια ματς εθνικων τελειωσαν (NL A-D, AFCONQ, φιλικα)
# και, ΜΟΝΟ αν υπαρχουν νεα, ξαναχτιζει Elo/xElo (Μ1), αγκυρα (Μ2/Μ3), προβολες και dashboard — intl_refresh.py.
# Καθε βραδυ 21:30 UTC (μετα τα ματς των 18:45/19:00) + 05:30 UTC (εφεδρικο). 0 credits Odds API.
# Χειροκινητα: κουμπι Run workflow Ή push του intl_refresh_trigger.txt (το commit ΧΩΡΙΣ [skip ci]).
on:
  schedule:
    - cron: '30 21 * * *'
    - cron: '30 5 * * *'
  workflow_dispatch: {}
  push:
    paths:
      - 'intl_refresh_trigger.txt'

permissions:
  contents: write

concurrency:
  group: intl-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Intl refresh (FotMob → build → Elo/xElo → αγκυρα → προβολες → dashboard)
        id: refresh
        env:
          PYTHONIOENCODING: utf-8
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python intl_refresh.py

      - name: Sanity tests (αποτυχια = ΟΧΙ commit)
        id: sanity
        continue-on-error: true
        run: pip install -q pytest && python -m pytest -q -p no:cacheprovider tests/test_scanner_sanity.py

      - name: Commit
        if: steps.sanity.outcome == 'success'
        run: |
          git config user.name "intl-refresh-bot"
          git config user.email "actions@github.com"
          # ενα-ενα (ενα αρχειο που λειπει, π.χ. NL C χωρις τελειωμενο ματς, δεν πρεπει να ακυρωσει ολο το add)
          for f in intl_matches.csv intl_ratings_h.csv intl_preds_H.csv intl_hfa_config.json intl_preds_anchor.csv intl_ratings_anchor.csv \
                   intl_projections.csv intl_nl_shadow_2627.csv intl_nl_overs_2627.csv intl_afconq_shadow_2627.csv intl_afconq_overs_2627.csv \
                   intl_projections_dashboard.json intl_refresh_log.jsonl intl_squads.json intl_callups_validate_out.txt \
                   data_NationsLeagueA_2627.json data_NationsLeagueB_2627.json data_NationsLeagueC_2627.json data_NationsLeagueD_2627.json \
                   data_AFCONQ_2627.json data_Friendlies_2026.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "καμια αλλαγη"
          else
            git commit -m "intl refresh: νεα αποτελεσματα εθνικων → ratings/προβολες [skip ci]"
            for i in 1 2 3 4 5; do
              # σε συγκρουση κραταει την εκδοση του refresh (το dashboard json το ξαναχτιζει ο scanner στο επομενο τικ)
              git pull --rebase -X theirs origin main && git push && break
              sleep 10
            done
          fi
