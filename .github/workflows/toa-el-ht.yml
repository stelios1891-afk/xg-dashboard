name: toa-el-ht

# Pinnacle στο ΗΜΙΧΡΟΝΟ για τα φετινα bets ημιχρονου Ευρωλιγκας (29/10/2026). ~10 credits ανα bet.
# v2 29/10: ολα τα ματς της ωρας (ταιριασμα ονοματων τοπικα).
# Πυροδοτηση: push αυτου του αρχειου / του el_ht_pin_slots.json ή Run workflow.

on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/toa-el-ht.yml'
      - 'el_ht_pin_slots.json'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Fetch
        env:
          TOA_KEY: ${{ secrets.TOA_KEY }}
          PYTHONIOENCODING: utf-8
        run: python toa_el_ht_fetch.py
      - name: Commit
        run: |
          git config user.name "toa-el-bot"; git config user.email "actions@github.com"
          git add -f toa_el_ht2.jsonl
          if git diff --cached --quiet; then echo "τιποτα"; else
            git commit -m "EL ημιχρονο Pinnacle [skip ci]"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
