name: nba-sudden-pin

# ΕΦΑΠΑΞ (24/10/2026, Στελιος «οκ»): τιμες Pinnacle (The Odds API historical) στις στιγμες μετα απο ΑΙΦΝΙΔΙΑ Out (t70).
# ~26.5k credits · ΞΕΚΙΝΑ ΜΟΝΟ απο 1/11/2026 (ανανεωση credits) · σταματα αν μεινουν < 60000 · συνεχιζει καθε μερα ως να τελειωσει.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 7 * * *'

permissions:
  contents: write

concurrency:
  group: nba-sudden-pin
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch
        env:
          TOA_KEY: ${{ secrets.TOA_KEY }}
          PYTHONIOENCODING: utf-8
        run: python nba_sudden_pin_pull.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "nba-sudden-pin-bot"
          git config user.email "actions@github.com"
          for i in 1 2 3; do
            for f in nba_sudden_pin.jsonl nba_sudden_pin_state.json; do [ -e "$f" ] && git add -f "$f"; done
            if git diff --cached --quiet; then echo "τιποτα"; break; fi
            git commit -m "nba sudden pin [skip ci]" && git pull --rebase -X theirs && git push && break
            sleep 10
          done
