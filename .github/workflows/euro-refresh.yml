name: euro-refresh

# ΚΑΘΗΜΕΡΙΝΗ (+βραδια ευρωπαικων) ανανεωση δεδομενων ευρωπαικου engine (εντολη Στελιου 10/9):
#   1. euro_refresh.py  -> data_{lg}_{2627|2026}.json 30 ευρω-λιγκων (FotMob),
#                          griffis_matches.csv (Ben, 9 λιγκες φετος),
#                          clubelo_current.csv (σελιδες χωρων clubelo.com)
#   2. euro_live_projections.py -> φρεσκο euro_projections.json (dashboard)
# Commit ΜΟΝΟ αν αλλαξε κατι, με [skip ci]. Τα CORE7 ΔΕΝ αγγιζονται (data-refresh.yml καθημερινα).
# ΠΡΟΫΠΟΘΕΣΗ CLOUD: τα inputs του euro engine (euro_engine.py, europe_fixtures_2627.json,
# clubelo_europe.csv, griffis_name_map.json, data_Europe_*.json, ιστορικα data_*.json των
# ευρω-λιγκων) πρεπει να ειναι committed στο repo — το guard step το ελεγχει και τα λεει.
on:
  schedule:
    - cron: '0 6 * * *'      # ΚΑΘΗΜΕΡΙΝΑ 06:00 UTC (~9πμ Ελλαδας), μετα το data-refresh των 05:00
    - cron: '0 23 * * 2,3,4' # + Τρ/Τετ/Πεμ 23:00 UTC: αμεσως μετα τα ευρωπαικα βραδινα (17/9 Στελιος:
                             #   «να ανανεωνονται οταν προστιθενται παιχνιδια»)
  workflow_dispatch: {}       # + χειροκινητο "Run workflow"
  push:
    paths:
      - 'euro_refresh_trigger.txt'   # χειροκινητη πυροδοτηση με push (οπως euro-scan-now)

permissions:
  contents: write

concurrency:
  group: euro-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # πληρες ιστορικο -> καθαρο rebase-before-push

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Guard — inputs του euro engine στο repo
        run: |
          missing=""
          for f in euro_refresh.py euro_live_projections.py euro_engine.py picks.py \
                   europe_fixtures_2627.json clubelo_europe.csv clubelo_current.csv \
                   griffis_matches.csv griffis_name_map.json league_offsets.json \
                   data_Europe_2122.json data_Europe_2526.json; do
            [ -f "$f" ] || missing="$missing $f"
          done
          n_hist=$(ls data_*_2425.json 2>/dev/null | wc -l)
          if [ -n "$missing" ]; then
            echo "::error::Λειπουν απο το repo:$missing — commit τα inputs του euro engine πρωτα."
            exit 1
          fi
          if [ "$n_hist" -lt 20 ]; then
            echo "::error::Μονο $n_hist data_*_2425.json στο repo — τα ιστορικα data των ευρω-λιγκων δεν ειναι committed."
            exit 1
          fi
          echo "guard OK (ιστορικα 2425: $n_hist αρχεια)"

      - name: Euro refresh (FotMob 30 λιγκες + Griffis + ClubElo)
        env:
          PYTHONIOENCODING: utf-8
        run: python euro_refresh.py

      # 26/9 (Στελιος): αποτελεσματα/προγραμμα UCL/UEL/UECL μετα απο καθε αγωνιστικη (FotMob) -> europe_fixtures_2627.json
      # (σκορ στο dashboard, σωστες ωρες σεντρας). Αν αποτυχει το αρχειο ΔΕΝ ξαναγραφεται (το script γραφει μονο στο τελος).
      # ΣΗΜ.: τα ευρωπαϊκα αποτελεσματα ΔΕΝ μπαινουν στα ratings — εκκρεμει τεστ (bias-free διορθωση αντιπαλου, βλ. y7b).
      - name: Euro cups — προγραμμα + αποτελεσματα (FotMob)
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python europe_fixtures_2627_fetch.py

      - name: Fresh euro projections
        env:
          PYTHONIOENCODING: utf-8
        run: python euro_live_projections.py

      # 9/10/2026: UEL ΦΑΒΟΡΙ ΕΝΤΟΣ = κανονικα picks με μιξη 80% xG (euro_blend_eval LOSO 4/4) -> euro_projections_uel80.json.
      # Το διαβαζει ο euro_shadow_scan (κανονας uel_home_fav). Μη κρισιμο: αν αποτυχει, μενει το προηγουμενο αρχειο.
      - name: Euro projections UEL 80% xG
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
          EURO_BLEND: '0.8'
          EURO_PROJ_OUT: euro_projections_uel80.json
        run: python euro_live_projections.py

      # 25/9: 🏀 Ευρωλιγκα — προγραμμα + box scores (επισημο API, χωρις κλειδι) + μοντελο v1 -> el_projections.json.
      # Χρειαζεται στο repo: el_refresh.py, el_model_test.py, el_fatigue_travel.py, el_box.json, el_sched.json, el_expert_prior.json, el_fantasy_prior.json (μονο numpy/pandas).
      # Μη κρισιμο: αν αποτυχει, το υπολοιπο euro-refresh συνεχιζει κανονικα.
      # 30/9: φετινα εγχωρια σκορ (Nowgoal, 10 λιγκες) για το el_domestic_live (φορμα στο πρωταθλημα → αφετηρια χαντικαπ).
      # Μη κρισιμο: αν αποτυχει, το el_refresh τρεχει με το τελευταιο bk_domestic.json του repo.
      - name: Domestic basketball scores (current season)
        if: always()
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python nowgoal_bk_domestic_fill.py --current

      # 1/10: ΑΥΤΟΜΑΤΗ ΠΡΟΕΤΟΙΜΑΣΙΑ (1/9-31/10, μεχρι να γινει «τελικη» 2 μερες μετα την πρεμιερα): φιλικα/Super Cups + Flashscore
      # τρεχουσας σεζον → el_preseason_prior.json. Μη κρισιμο: αν αποτυχει, μενει το προηγουμενο αρχειο.
      - name: Euroleague preseason prior (auto, Sep-Oct)
        if: always()
        continue-on-error: true
        timeout-minutes: 45
        env:
          PYTHONIOENCODING: utf-8
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_INFO_TOKEN: ${{ secrets.TELEGRAM_INFO_TOKEN }}
          TELEGRAM_INFO_CHAT_ID: ${{ secrets.TELEGRAM_INFO_CHAT_ID }}
        run: python el_preseason_auto.py

      - name: Euroleague refresh (el_refresh.py)
        if: always()
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python el_refresh.py

      # 1/10: 🏀 EuroCup — φετινα εγχωρια 6 επιπλεον πρωταθληματων (Flashscore: Πολωνια, Ρουμανια, Αγγλια, BNXT, Λετονια-Εσθονια, Ουκρανια)
      # + προγραμμα/box (επισημο API, competition U) + μοντελο → ec_projections.json. Μη κρισιμα.
      - name: EuroCup extra domestic leagues (current season)
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        env:
          PYTHONIOENCODING: utf-8
        run: python flashscore_bk_extra.py

      - name: EuroCup refresh (ec_refresh.py)
        if: always()
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python ec_refresh.py

      - name: Basketball Champions League refresh (bcl_refresh.py)
        if: always()
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python bcl_refresh.py

      - name: NBA refresh (nba_refresh.py)
        if: always()
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python nba_refresh.py

      - name: Sanity tests (αποτυχια = ΟΧΙ commit, το workflow συνεχιζει)
        id: sanity
        continue-on-error: true
        run: pip install -q pytest && python -m pytest -q -p no:cacheprovider tests/test_scanner_sanity.py

      - name: Commit if changed
        if: steps.sanity.outcome == 'success'
        run: |
          git config user.name "euro-refresh-bot"
          git config user.email "actions@github.com"
          git add -f data_*_2627.json data_*_2026.json griffis_matches.csv clubelo_current.csv euro_projections.json europe_fixtures_2627.json el_projections.json el_box.json el_sched.json el_shadow_lines.json bk_domestic.json el_preseason_prior.json fs_bk_preseason.json fs_bk_games.json el_season_warned.txt ec_projections.json ec_box.json ec_sched.json fs_bk_extra.json bcl_state.json fs_bk_stats.jsonl nba_state.json nba_espn_games.json nba_injuries.json nba_full_z.json   # -f: νεες λιγκες ειναι gitignored (data_*.json)
          for f in euro_projections_uel80.json; do if [ -e "$f" ]; then git add -f "$f"; fi; done   # 9/10 (προαιρετικο → ΜΟΝΟ στον βροχο)
          if git diff --cached --quiet; then
            echo "no changes — skip commit"
          else
            git commit -m "euro refresh [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep 5
            done
          fi
