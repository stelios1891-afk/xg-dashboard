name: toa-btts-hist

# 27/9/2026 (Στελιος): πραγματικες ιστορικες τιμες BTTS ΜΟΝΟ για τα υποψηφια ματς του τεστ (picks + «λιγο κατω»).
# Πυροδοτηση: push του toa_btts_hist_trigger.txt ή Run workflow. ~2.500 credits, resumable, σταματα κατω απο 3.000.
on:
  workflow_dispatch: {}
  push:
    paths:
      - 'toa_btts_hist_trigger.txt'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOA_KEY: ${{ secrets.TOA_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Fetch historical BTTS (candidates only)
        run: python toa_btts_hist.py
      - name: Commit
        if: always()
        run: |
          git config user.name "toa-btts-hist-bot"
          git config user.email "actions@github.com"
          git add -f toa_btts_hist.jsonl || true
          if git diff --cached --quiet; then echo "τιποτα"; else
            git commit -m "toa btts hist: πραγματικες τιμες BTTS υποψηφιων [skip ci]"
            for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; sleep 10; done
          fi
