name: lineup-timer

# ΠΡΟΣΩΡΙΝΟ πειραμα (1/9/2026): χρονομετρηση ποτε εμφανιζονται οι 11αδες στο FotMob
# (Championship αποψε). Τρεχει στο cloud ωστε να μη χρειαζεται ανοιχτο laptop.
# Μετα το πειραμα το αρχειο αυτο διαγραφεται.

on:
  schedule:
    - cron: '40 16 2 9 *'     # 16:50 UTC σημερα (το GitHub μπορει να αργησει λιγα λεπτα)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  timer:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run timer (πολινγκ ως 18:55 UTC)
        env:
          PYTHONIOENCODING: utf-8
        run: python lineup_timer.py
      - name: Commit results
        run: |
          git config user.name "lineup-timer-bot"
          git config user.email "actions@github.com"
          git add lineup_timing.jsonl
          if git diff --cached --quiet; then echo "no results"; else
            git commit -m "lineup timing πειραμα v2 2/9 [skip ci]"
            git pull --rebase --autostash origin main && git push
          fi
