name: toa-pin-vig-oneoff

# ONE-OFF: Pinnacle γκανιοτα ανα ωρα προ ΚΟ, EPL 2627 πρωτες αγωνιστικες (~1.4k credits).

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'toa_pin_vig.py'

permissions:
  contents: write

concurrency:
  group: toa-pin-vig
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Pull Pinnacle vig snapshots
        env:
          TOA_KEY: ${{ secrets.TOA_KEY }}
          PYTHONIOENCODING: utf-8
        run: python toa_pin_vig.py

      - name: Commit results
        run: |
          git config user.name "toa-pin-vig-bot"
          git config user.email "actions@github.com"
          git add toa_pin_vig_out.txt toa_pin_vig.jsonl
          if git diff --cached --quiet; then
            echo "no results"
          else
            git commit -m "toa pinnacle vig by hour, EPL 2627 early rounds [skip ci]"
            git pull --rebase
            git push
          fi
