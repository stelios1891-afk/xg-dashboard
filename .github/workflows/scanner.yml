name: value-scanner

on:
  schedule:
    - cron: '*/15 * * * *'      # καθε ~15' (UTC· το GitHub μπορει να αργησει λιγο). Τα «σκετα» τικ
                                # ειναι δωρεαν (gating skip, 0 TOA credits)· το 15αλεπτο χρειαζεται
                                # για το snapshot κλεισιματος λιγο πριν καθε σεντρα (2026-09-02)
  workflow_dispatch: {}          # + χειροκινητο κουμπι "Run workflow"

permissions:
  contents: write                # για commit των αποτελεσματων πισω στο repo

concurrency:
  group: value-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # gating state (last_scan / fixtures cache) — μενει σε cache, οχι στο repo
      - name: Restore gating state
        uses: actions/cache@v4
        with:
          path: |
            value_last_scan.txt
            value_fixtures_cache.json
            clv_report_last.txt
            red_flag_state.json
          key: scanner-state-${{ github.run_id }}
          restore-keys: |
            scanner-state-

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scanner (adaptive)
        env:
          TOA_KEY: ${{ secrets.TOA_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scan_value.py            # manual = force scan τωρα (για τεστ/επιβεβαιωση)
          else
            python scan_value.py auto       # scheduled = adaptive gating
          fi

      # commit ΜΟΝΟ οταν αλλαξαν τα picks (state) → το dashboard ανανεωνεται μονο σε νεα/αλλαγες
      - name: Commit picks if changed
        run: |
          git config user.name "scanner-bot"
          git config user.email "actions@github.com"
          for f in clv_bets.jsonl clv_ledger.jsonl; do [ -f "$f" ] || : > "$f"; done
          git add value_scan_state.json value_picks_latest.json market_1x2_latest.json odds_history.jsonl odds_history_state.json clv_bets.jsonl clv_ledger.jsonl
          if git diff --cached --quiet -- value_scan_state.json market_1x2_latest.json odds_history_state.json clv_bets.jsonl clv_ledger.jsonl; then
            echo "no pick/market changes — skip commit"
          else
            git commit -m "picks/market update [skip ci]"
            git push
          fi
