name: value-scanner

on:
  schedule:
    - cron: '4,19,34,49 * * * *'  # καθε ~15' σε «ακυρα» λεπτα. ΣΗΜΕΙΩΣΗ 18/9: τα scheduled
                                  # αραιωνονται αγρια (κενα 1-5h) — γι' αυτο καθε run πλεον
                                  # μενει ζωντανο ~1 ωρα και σκαναρει σε βροχη καθε 5'
                                  # (scanner_tick.sh)· το cron ειναι απλως η ανα-εκκινηση.
                                  # Repo public => Actions λεπτα δωρεαν. Concurrency: οσο
                                  # τρεχει ενα run, το επομενο περιμενει στην ουρα και
                                  # ξεκιναει μολις τελειωσει => συνεχης καλυψη.
  workflow_dispatch:             # χειροκινητο (χωρις βροχη) Ή κρικος της αλυσιδας (chain=yes)
    inputs:
      chain:
        description: 'internal: self-chain link'
        required: false
        default: 'no'
  push:
    paths:
      - 'scanner_kick.txt'       # χειροκινητη επαν-εκκινηση της αλυσιδας με push

permissions:
  contents: write                # για commit των αποτελεσματων πισω στο repo
  actions: write                 # για το self-dispatch της αλυσιδας (18/9)

concurrency:
  group: value-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      TOA_KEY: ${{ secrets.TOA_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_INFO_TOKEN: ${{ secrets.TELEGRAM_INFO_TOKEN }}   # 26/9: 2ο bot (πληροφοριες, οχι picks)· κενο = πεφτει στο picks bot
      TELEGRAM_INFO_CHAT_ID: ${{ secrets.TELEGRAM_INFO_CHAT_ID }}
      PYTHONIOENCODING: utf-8
      GH_DISPATCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 26/9: intl_refresh_due.py → dispatch intl-refresh μολις τελειωσει ματς εθνικων
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # gating state (last_scan / fixtures cache) — μενει σε cache, οχι στο repo
      - name: Restore gating state
        uses: actions/cache@v4
        with:
          path: |
            value_last_scan.txt
            value_fixtures_cache.json
            clv_report_last.txt
            red_flag_state.json
            dom_fix_cache.json
          key: scanner-state-${{ github.run_id }}
          restore-keys: |
            scanner-state-

      - name: Install deps
        run: pip install -r requirements.txt pytest

      # πρωτο περασμα αμεσως (χειροκινητο = force, χωρις gating)
      - name: Scanner pass
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bash scanner_tick.sh force
          else
            bash scanner_tick.sh auto
          fi

      # ANTI-THINNING LOOP (18/9): ο runner μενει ζωντανος ~55-70 λεπτα, τικ καθε 5'.
      # Το gating συχνοτητας/credits ζει μεσα στα scripts (σκετα τικ = 0 credits).
      # Στο χειροκινητο τρεξιμο ΔΕΝ τρεχει (γρηγορος ελεγχος).
      - name: Anti-thinning loop
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.chain == 'yes'
        run: |
          for i in $(seq 1 10); do
            sleep 300
            echo "=== loop tick $i/10 ($(date -u +%H:%M)) ==="
            git pull --rebase --autostash || true
            bash scanner_tick.sh auto
          done

      # ΑΛΥΣΙΔΑ (18/9): τα scheduled crons επεσαν σε ολικο «κωμα» (κενα 4-5h μετρημενα και
      # με τα off-minutes). Καθε run ξεκιναει μονο του το επομενο στο τελος της βροχης —
      # συνεχης καλυψη ανεξαρτητα απο το cron (που μενει ως εφεδρικο προσαναμμα).
      # Σταματημα αλυσιδας: Actions -> disable workflow.
      - name: Chain next run
        if: always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.chain == 'yes')
        run: |
          curl -s -X POST             -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scanner.yml/dispatches"             -d '{"ref":"main","inputs":{"chain":"yes"}}'             && echo "επομενος κρικος ζητηθηκε" || echo "chain dispatch failed (το cron θα το πιασει)"
