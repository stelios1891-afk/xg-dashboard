name: intl-toa-books

# ΔΙΑΓΝΩΣΤΙΚΟ (25/9): ποια βιβλια του Odds API εχουν 1Χ2/AH/OU στα ματς Nations League και με τι γκανιοτα. ~6 credits.
on:
  workflow_dispatch: {}
  push:
    paths:
      - 'intl_toa_books_request.txt'

permissions:
  contents: write

concurrency:
  group: intl-toa-books
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Check
        env:
          TOA_KEY: ${{ secrets.TOA_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python intl_toa_books.py | tee intl_toa_books.log
          echo '=== REGIONS us,us2,au ===' | tee -a intl_toa_books.log
          REGIONS=us,us2,au python intl_toa_books.py | tee -a intl_toa_books.log
      - name: Commit log
        run: |
          git config user.name "intl-toa-books-bot"
          git config user.email "actions@github.com"
          git add -f intl_toa_books.log
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "intl toa books log [skip ci]"
            for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep 15; done
          fi
