name: ufc-pin-log

# 3/11/2026 (Στελιος «στησε την καταγραφη χωρις να λαμβανω αλερτς στο τελεγκραμ»): ωριαια καταγραφη τιμων + οριων
# Pinnacle για UFC (guest API, 0 credits). ΜΟΝΟ καταγραφη — κανενα Telegram, κανενα pick. Script: ufc_pin_log.py

on:
  workflow_dispatch: {}
  push:   # 1ο τρεξιμο αμεσως (το νεο schedule αργησε να ξεκινησει, 3/11)
    paths:
      - '.github/workflows/ufc-pin-log.yml'
      - 'ufc_pin_log.py'
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: ufc-pin-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Log
        env:
          PYTHONIOENCODING: utf-8
        run: python ufc_pin_log.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "ufc-pin-log-bot"
          git config user.email "actions@github.com"
          ls -la ufc_pin_log.jsonl ufc_pin_log_state.json || true
          for f in ufc_pin_log.jsonl ufc_pin_log_state.json; do [ -e "$f" ] && git add -f "$f"; done   # ενα-ενα (αρχειο που λειπει ακυρωνε ολο το add)
          if git diff --cached --quiet; then echo "τιποτα νεο"; exit 0; fi
          git commit -m "ufc pin log [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main && git rebase -X theirs origin/main && git push origin HEAD:main && break   # 3/11: το παλιο pull --rebase αποτυγχανε σιωπηλα
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          git fetch origin main
          if [ "$(git rev-list --count origin/main..HEAD)" != "0" ]; then echo "ΔΕΝ ανεβηκε"; exit 1; fi
