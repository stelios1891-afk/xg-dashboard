name: toa-basket-check

# ΕΦΑΠΑΞ ελεγχος καλυψης μπασκετ/Ευρωλιγκας στο The Odds API (24/9, project Ευρωλιγκας).
# Πυροδοτηση: push αυτου του αρχειου ή του toa_basket_check.py. Κοστος ~150 credits.

on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/toa-basket-check.yml'
      - 'toa_basket_check.py'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Basketball coverage check
        env:
          TOA_KEY: ${{ secrets.TOA_KEY }}
          PYTHONIOENCODING: utf-8
        run: python toa_basket_check.py
      - name: Commit result
        run: |
          git config user.name "toa-basket-bot"
          git config user.email "actions@github.com"
          git add -f toa_basket_check_out.txt
          if git diff --cached --quiet; then echo "τιποτα"; else
            git commit -m "toa basket check [skip ci]"
            git pull --rebase
            git push
          fi
