<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0f1e;font-family:'DM Sans','Segoe UI',sans-serif;color:#e8edf8;overflow:hidden;}
.wrap{display:flex;gap:6px;padding:4px;}
.bench{width:158px;background:#0d1426;border:1px solid #1a2540;border-radius:10px;padding:5px;
       max-height:520px;overflow-y:auto;flex-shrink:0;}
.bench h4{font-size:9px;color:#6b7fa3;letter-spacing:1px;text-transform:uppercase;padding:2px 4px 6px;}
.pitchbox{flex:1;display:flex;flex-direction:column;min-width:0;}
.tname{font-size:11.5px;font-weight:700;text-align:center;padding:2px 0 5px;color:#cdd8ee;}
.pitch{flex:1;min-height:480px;border-radius:10px;display:flex;flex-direction:column;
       background:repeating-linear-gradient(0deg,#0f2b1c 0 48px,#113620 48px 96px);
       border:2px solid #1e4a33;position:relative;}
.pitch::before{content:'';position:absolute;left:50%;top:8px;bottom:8px;width:0;}
.line{flex:1;display:flex;justify-content:space-evenly;align-items:center;padding:2px 4px;gap:3px;}
.chip{background:#111827ee;border:1px solid #2d4470;border-radius:8px;padding:3px 4px;
      cursor:grab;text-align:center;transition:border-color .1s, background .1s;
      flex:1;min-width:0;max-width:118px;}
.chip.dragover{border-color:#f3c74b;background:#2b2410ee;}
.chip .nm{font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chip .meta{font-size:8.5px;color:#8fa3c8;font-family:'JetBrains Mono',monospace;}
.chip .meta b{color:#e8edf8;}
.bchip{background:#111827;border:1px solid #26324e;border-radius:8px;padding:3px 5px;margin-bottom:4px;cursor:grab;}
.bchip:hover{border-color:#4b7cf3;}
.bchip .nm{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bchip .meta{font-size:8.5px;color:#6b7fa3;font-family:'JetBrains Mono',monospace;}
.postag{display:inline-block;font-size:8px;border-radius:3px;padding:0 3px;margin-right:2px;font-weight:700;}
.p0{background:#2b2410;color:#f3c74b;} .p1{background:#10251b;color:#34d17a;}
.p2{background:#16203a;color:#7ea2ff;} .p3{background:#2a1418;color:#e05563;}
.newdot{color:#f3c74b;font-size:9px;}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
"use strict";
const POS=['GK','DEF','MID','ATT'];
let state=null;
let dragSrc=null;

function send(){
  window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setComponentValue",
    dataType:"json", value:{home:state.home.xi.slice(),away:state.away.xi.slice()}},"*");
}
function setH(h){window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setFrameHeight",height:h},"*");}

function chipHTML(p){
  const tag=`<span class="postag p${p.pos}">${POS[p.pos]||'?'}</span>`;
  const nd=p.new?` <span class="newdot" title="χωρις ιστορικο">●</span>`:'';
  return `<div class="nm">${tag}${p.nm}${nd}</div><div class="meta"><b>${p.rt.toFixed(2)}</b> · ${p.st15}/15</div>`;
}

function render(){
  const root=document.getElementById('root');
  root.innerHTML='';
  root.appendChild(benchEl('home'));
  root.appendChild(pitchEl('home'));
  root.appendChild(pitchEl('away'));
  root.appendChild(benchEl('away'));
  setH(document.body.scrollHeight+8);
}

function pmap(side){const m={}; state[side].players.forEach(p=>m[p.id]=p); return m;}

function pitchEl(side){
  const box=document.createElement('div'); box.className='pitchbox';
  const t=document.createElement('div'); t.className='tname'; t.textContent=state[side].name; box.appendChild(t);
  const pitch=document.createElement('div'); pitch.className='pitch';
  const pm=pmap(side);
  const groups=[[],[],[],[]];
  state[side].xi.forEach(id=>{const p=pm[id]; if(p) groups[Math.min(p.pos,3)].push(p);});
  [3,2,1,0].forEach(gi=>{                       // ΑΤΤ πανω ... GK κατω
    const line=document.createElement('div'); line.className='line';
    groups[gi].forEach(p=>{
      const c=document.createElement('div'); c.className='chip'; c.draggable=true;
      c.innerHTML=chipHTML(p);
      c.addEventListener('dragstart',()=>{dragSrc={side:side,where:'pitch',id:p.id};});
      c.addEventListener('dragover',e=>{if(dragSrc&&dragSrc.side===side){e.preventDefault();c.classList.add('dragover');}});
      c.addEventListener('dragleave',()=>c.classList.remove('dragover'));
      c.addEventListener('drop',e=>{
        e.preventDefault(); c.classList.remove('dragover');
        if(!dragSrc||dragSrc.side!==side||dragSrc.id===p.id) return;
        const xi=state[side].xi;
        if(dragSrc.where==='bench'){ xi[xi.indexOf(p.id)]=dragSrc.id; }
        dragSrc=null; render(); send();
      });
      line.appendChild(c);
    });
    pitch.appendChild(line);
  });
  box.appendChild(pitch);
  return box;
}

function benchEl(side){
  const b=document.createElement('div'); b.className='bench';
  b.innerHTML=`<h4>Παγκος — ${state[side].name}</h4>`;
  const inXI=new Set(state[side].xi);
  const bench=state[side].players.filter(p=>!inXI.has(p.id))
    .sort((a,z)=>a.pos-z.pos || z.st15-a.st15 || z.rt-a.rt);
  bench.forEach(p=>{
    const c=document.createElement('div'); c.className='bchip'; c.draggable=true;
    c.innerHTML=chipHTML(p);
    c.addEventListener('dragstart',()=>{dragSrc={side:side,where:'bench',id:p.id};});
    b.appendChild(c);
  });
  return b;
}

window.addEventListener('message',ev=>{
  const d=ev.data;
  if(d.type==='streamlit:render'){
    const a=d.args;
    if(!state || a.matchKey!==state.matchKey){
      state={matchKey:a.matchKey, home:a.home, away:a.away};
      state.home.xi=a.home.xi.slice(); state.away.xi=a.away.xi.slice();
    }else{
      state.home.players=a.home.players; state.away.players=a.away.players;
      state.home.name=a.home.name; state.away.name=a.away.name;
    }
    render();
  }
});
window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:componentReady",apiVersion:1},"*");
setH(540);
</script>
</body>
</html>
